[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-dump-to-outline"
version = "0.1.0"
description = "Turn a messy brain-dump file or folder of notes into a tidy heading hierarchy, a decisions-to-make list, and next-three-actions - drafted by any OpenAI-compatible endpoint (Ollama included, config file, no keys) with an offline rule-based fallback."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["brain-dump", "outline", "adhd", "productivity", "ollama", "local-llm", "note-taking", "author-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bd2outline = "brainDumpOutline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["brainDumpOutline*"]
